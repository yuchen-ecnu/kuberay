apiVersion: ray.io/v1
kind: FederatedRayCluster
metadata:
  name: ray-federation
spec:
  primaryCluster:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
        object-store-memory: "134217728"
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray:2.56.0-py311-cpu
            resources:
              requests: {cpu: "500m", memory: "1Gi"}
              limits: {cpu: "2", memory: "2Gi"}
    workerGroups:
    - groupName: primary-cpu
      # Initial target only. Edit the generated primary RayCluster to scale.
      replicas: 1
      resources: {CPU: "1", primary: "1"}
      rayStartParams:
        object-store-memory: "134217728"
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ray-worker
            image: rayproject/ray:2.56.0-py311-cpu
            resources:
              requests: {cpu: "500m", memory: "1Gi"}
              limits: {cpu: "2", memory: "2Gi"}
  memberClusters:
  - name: member-b
    namespace: ray-federation
    # No kubeconfigSecretRef: create ray-member-standalone.yaml in the member cluster.
    # Worker groups and replicas are declared only on the member RayCluster.
  networking:
    headEndpoint:
      mode: UserProvided
      # Use the same routable endpoint in ray-member-standalone.yaml.
      address: ray-head.internal.example
      gcsPort: 6379

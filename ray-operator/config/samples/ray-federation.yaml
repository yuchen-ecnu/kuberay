apiVersion: ray.io/v1
kind: FederatedRayCluster
metadata:
  name: ray-federation
spec:
  memberCleanupPolicy: Delete
  primaryCluster:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
        object-store-memory: "134217728"
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray:2.56.0-py311-cpu
            resources:
              requests: {cpu: "500m", memory: "1Gi"}
              limits: {cpu: "2", memory: "2Gi"}
    workerGroups:
    - groupName: primary-cpu
      # Initial target only. Edit the generated primary RayCluster to scale this group.
      replicas: 1
      minReplicas: 0
      maxReplicas: 4
      resources: {CPU: "1", primary: "1"}
      rayStartParams:
        object-store-memory: "134217728"
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ray-worker
            image: rayproject/ray:2.56.0-py311-cpu
            resources:
              requests: {cpu: "500m", memory: "1Gi"}
              limits: {cpu: "2", memory: "2Gi"}
  memberClusters:
  - name: member-b
    namespace: ray-federation
    kubeconfigSecretRef:
      name: member-b-kubeconfig
    workerGroups:
    - groupName: member-cpu
      # Initial target only. Runtime targets flow from the primary RayCluster.
      replicas: 2
      minReplicas: 0
      maxReplicas: 4
      resources: {CPU: "1", member: "1"}
      rayStartParams:
        object-store-memory: "134217728"
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ray-worker
            image: rayproject/ray:2.56.0-py311-cpu
            resources:
              requests: {cpu: "500m", memory: "1Gi"}
              limits: {cpu: "2", memory: "2Gi"}
  networking:
    headEndpoint:
      mode: UserProvided
      # Replace with a stable, private endpoint routable from every member Pod.
      address: ray-head.internal.example
      gcsPort: 6379
